[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescuetwin"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17"]

[project.optional-dependencies]
vision = ["ultralytics>=8.3", "Pillow>=10"]
agent = ["google-genai>=1,<3"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["rescuetwin*"]

[tool.pytest.ini_options]
pythonpath = ["."]
